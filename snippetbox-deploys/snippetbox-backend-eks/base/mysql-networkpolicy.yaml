apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: snippetbox-mysql
  labels:
    app.kubernetes.io/name: snippetbox-mysql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: snippetbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: snippetbox-mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 3306
