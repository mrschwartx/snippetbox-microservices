name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: SnippetBox commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

  snippetbox-backend-quality:
    name: SnippetBox backend ${{ matrix.service }} code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [user, snippet]
    defaults:
      run:
        working-directory: snippetbox-backend-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: snippetbox-backend-${{ matrix.service }}/go.mod
          cache: true
          cache-dependency-path: snippetbox-backend-${{ matrix.service }}/go.sum
      - name: Install
        run: go mod download
      - name: Verify modules
        run: |
          go mod verify
          go mod tidy -diff
      - name: Format
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: make vet
      - name: Unit tests
        run: make test/race
      - name: Integration tests
        run: make test/integration
      - name: E2E tests
        run: make test/e2e
      - name: Testing coverage
        run: |
          make test/cover
          go tool cover -html=coverage.out -o coverage.html
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.service }}-coverage
          path: |
            snippetbox-backend-${{ matrix.service }}/coverage.out
            snippetbox-backend-${{ matrix.service }}/coverage.html
          retention-days: 7

  snippetbox-backend-build:
    name: SnippetBox backend ${{ matrix.service }} build
    runs-on: ubuntu-latest
    needs: snippetbox-backend-quality
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [user, snippet]
    defaults:
      run:
        working-directory: snippetbox-backend-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: snippetbox-backend-${{ matrix.service }}/go.mod
          cache: true
          cache-dependency-path: snippetbox-backend-${{ matrix.service }}/go.sum
      - name: Build
        run: make build

  snippetbox-frontend-quality:
    name: SnippetBox frontend code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: snippetbox-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snippetbox-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Testing coverage
        run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: snippetbox-frontend/coverage
          retention-days: 7

  snippetbox-frontend-build:
    name: SnippetBox frontend build
    runs-on: ubuntu-latest
    needs: snippetbox-frontend-quality
    timeout-minutes: 15
    defaults:
      run:
        working-directory: snippetbox-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snippetbox-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  snippetbox-frontend-e2e-browser:
    name: SnippetBox frontend end-to-end browser
    runs-on: ubuntu-latest
    needs: snippetbox-frontend-build
    timeout-minutes: 20
    defaults:
      run:
        working-directory: snippetbox-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snippetbox-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            snippetbox-frontend/playwright-report
            snippetbox-frontend/test-results
          retention-days: 7

  snippetbox-docker:
    name: SnippetBox docker containers
    runs-on: ubuntu-latest
    needs: [snippetbox-backend-build, snippetbox-frontend-build]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: snippetbox-docker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build user service image
        uses: docker/build-push-action@v6
        with:
          context: snippetbox-backend-user
          file: snippetbox-docker/snippetbox-backend-user/Dockerfile
          load: true
          tags: snippetbox-backend-user:local
          cache-from: type=gha,scope=backend-user
          cache-to: type=gha,mode=max,scope=backend-user
      - name: Build snippet service image
        uses: docker/build-push-action@v6
        with:
          context: snippetbox-backend-snippet
          file: snippetbox-docker/snippetbox-backend-snippet/Dockerfile
          load: true
          tags: snippetbox-backend-snippet:local
          cache-from: type=gha,scope=backend-snippet
          cache-to: type=gha,mode=max,scope=backend-snippet
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: snippetbox-frontend
          file: snippetbox-docker/snippetbox-frontend/Dockerfile
          load: true
          tags: snippetbox-frontend:local
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Prepare env
        run: cp .env.example .env
      - name: Run containers
        run: docker compose -f docker-compose.local.yml up -d --no-build
      - name: Wait for health checks
        run: |
          for port in 8080 8082; do
            ready=false
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:$port/ping" | grep -q '"status":"ok"'; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              docker compose -f docker-compose.local.yml logs
              exit 1
            fi
          done
      - name: Check user service
        run: |
          for path in /ping /swagger/ /swagger/openapi.json; do
            curl -fsS -o /dev/null "http://localhost:8080$path"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/snippets)" = "404"
      - name: Check snippet service
        run: |
          for path in /ping /swagger/ /swagger/openapi.json /api/v1/snippets; do
            curl -fsS -o /dev/null "http://localhost:8082$path"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8082/api/v1/auth/login)" = "404"
      - name: Check pages
        run: |
          for path in / /user/login /user/signup /snippet/create /snippet/view/1; do
            curl -fsS -o /dev/null "http://localhost:3000$path"
          done
      - name: Check API through the frontend proxy
        run: |
          base=http://localhost:3000/api/v1
          email="ci-$(date +%s)@example.com"
          password="ci-password-123"
          json='Content-Type: application/json'

          curl -fsS -X POST "$base/auth/signup" -H "$json" \
            -d "{\"name\":\"CI\",\"email\":\"$email\",\"password\":\"$password\"}" -o /dev/null

          token=$(curl -fsS -X POST "$base/auth/login" -H "$json" \
            -d "{\"email\":\"$email\",\"password\":\"$password\"}" | jq -r .token)
          test -n "$token" && test "$token" != null

          curl -fsS "$base/auth/me" -H "Authorization: Bearer $token" | jq -e --arg email "$email" '.email == $email'

          id=$(curl -fsS -X POST "$base/snippets" -H "$json" -H "Authorization: Bearer $token" \
            -d '{"title":"CI snippet","content":"hello","expires":1}' | jq -r .id)
          test -n "$id" && test "$id" != null

          curl -fsS "$base/snippets/$id" | jq -e '.title == "CI snippet"'
          curl -fsS "$base/snippets" | jq -e 'length >= 1'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/snippets/0")" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/snippets" -H "$json" -d '{}')" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/snippets" -H "$json" -H 'Authorization: Bearer invalid' -d '{}')" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/unknown")" = "404"
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.local.yml logs
      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.local.yml down -v
