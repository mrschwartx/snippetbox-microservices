services:
  snippetbox-mysql:
    image: mysql:8.4
    container_name: snippetbox-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: P@ssw0rd!
      USER_DB_NAME: snippetbox_user_dev
      USER_DB_USER: dev_user
      USER_DB_PASSWORD: dev_pass
      SNIPPET_DB_NAME: snippetbox_snippet_dev
      SNIPPET_DB_USER: dev_user
      SNIPPET_DB_PASSWORD: dev_pass
    ports:
      - "3306:3306"
    volumes:
      - snippetbox-mysql-data:/var/lib/mysql
      - ./mysql/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  snippetbox-phpmyadmin:
    image: phpmyadmin:5
    container_name: snippetbox-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: snippetbox-mysql
    ports:
      - "5050:80"
    depends_on:
      snippetbox-mysql:
        condition: service_healthy

volumes:
  snippetbox-mysql-data:
