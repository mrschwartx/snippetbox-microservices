apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snippetbox
  labels:
    app.kubernetes.io/name: snippetbox
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: snippetbox
  annotations:
    kubernetes.azure.com/tls-cert-keyvault-uri: ${KEYVAULT_CERT_URI}
spec:
  ingressClassName: webapprouting.kubernetes.azure.com
  rules:
    - host: ${DOMAIN}
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: snippetbox-backend-user
                port:
                  number: 8080
          - path: /api/v1/snippets
            pathType: Prefix
            backend:
              service:
                name: snippetbox-backend-snippet
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: snippetbox-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - ${DOMAIN}
      secretName: keyvault-snippetbox
