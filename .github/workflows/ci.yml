name: SnippetBox CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: snippetbox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msa-backend-testing:
    name: snippetbox backend ${{ matrix.service }} testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [user, snippet]
    defaults:
      run:
        working-directory: snippetbox-msa-backend-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: snippetbox-msa-backend-${{ matrix.service }}/go.mod
          cache: true
          cache-dependency-path: snippetbox-msa-backend-${{ matrix.service }}/go.sum
      - run: go mod download
      - run: |
          go mod verify
          go mod tidy -diff
      - run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - run: make vet
      - run: make test/race
      - run: make test/integration
      - run: make test/e2e
      - run: |
          make test/cover
          go tool cover -html=coverage.out -o coverage.html
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.service }}
          path: |
            snippetbox-msa-backend-${{ matrix.service }}/coverage.out
            snippetbox-msa-backend-${{ matrix.service }}/coverage.html
          if-no-files-found: error
          retention-days: 7

  msa-backend-build:
    name: snippetbox backend ${{ matrix.service }} build
    runs-on: ubuntu-latest
    needs: [msa-backend-testing]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [user, snippet]
    defaults:
      run:
        working-directory: snippetbox-msa-backend-${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: snippetbox-msa-backend-${{ matrix.service }}/go.mod
          cache: true
          cache-dependency-path: snippetbox-msa-backend-${{ matrix.service }}/go.sum
      - run: make build

  msa-frontend-testing:
    name: snippetbox frontend testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: snippetbox-msa-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snippetbox-msa-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: snippetbox-msa-frontend/coverage
          retention-days: 7

  msa-frontend-build:
    name: SnippetBox frontend build
    runs-on: ubuntu-latest
    needs: [msa-frontend-testing]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: snippetbox-msa-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snippetbox-msa-frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  msa-frontend-e2e-browser:
    name: snippetbox frontend e2e browser
    runs-on: ubuntu-latest
    needs: [msa-frontend-testing]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: snippetbox-msa-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snippetbox-msa-frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            snippetbox-msa-frontend/playwright-report
            snippetbox-msa-frontend/test-results
          retention-days: 7

  msa-docker:
    name: SnippetBox docker containers
    runs-on: ubuntu-latest
    needs: [msa-backend-build, msa-frontend-build, msa-frontend-e2e-browser]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: snippetbox-docker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build user service image
        uses: docker/build-push-action@v6
        with:
          context: snippetbox-msa-backend-user
          file: snippetbox-docker/snippetbox-msa-backend-user/Dockerfile
          load: true
          tags: snippetbox-msa-backend-user:local
          cache-from: type=gha,scope=backend-user
          cache-to: type=gha,mode=max,scope=backend-user
      - name: Build snippet service image
        uses: docker/build-push-action@v6
        with:
          context: snippetbox-msa-backend-snippet
          file: snippetbox-docker/snippetbox-msa-backend-snippet/Dockerfile
          load: true
          tags: snippetbox-msa-backend-snippet:local
          cache-from: type=gha,scope=backend-snippet
          cache-to: type=gha,mode=max,scope=backend-snippet
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: snippetbox-msa-frontend
          file: snippetbox-docker/snippetbox-msa-frontend/Dockerfile
          load: true
          tags: snippetbox-msa-frontend:local
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Prepare env
        run: cp .env.example .env
      - name: Run containers
        run: docker compose -f docker-compose.local.yml up -d --no-build
      - name: Wait for health checks
        run: |
          for port in 8081 8082; do
            ready=false
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:$port/ping" | jq -e '.status == "ok"' > /dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              docker compose -f docker-compose.local.yml logs
              exit 1
            fi
          done
      - name: Check user service
        run: |
          for path in /ping /swagger/ /swagger/openapi.json; do
            curl -fsS -o /dev/null "http://localhost:8081$path"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/v1/snippets)" = "404"
      - name: Check snippet service
        run: |
          for path in /ping /swagger/ /swagger/openapi.json /api/v1/snippets; do
            curl -fsS -o /dev/null "http://localhost:8082$path"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8082/api/v1/auth/login)" = "404"
      - name: Check pages
        run: |
          for path in / /user/login /user/signup /snippet/create /snippet/view/1; do
            curl -fsS -o /dev/null "http://localhost:3000$path"
          done
      - name: Check API through the frontend proxy
        run: |
          base=http://localhost:3000/api/v1
          email="ci-$(date +%s)@example.com"
          password="ci-password-123"
          json='Content-Type: application/json'

          curl -fsS -X POST "$base/auth/signup" -H "$json" \
            -d "{\"name\":\"CI\",\"email\":\"$email\",\"password\":\"$password\"}" -o /dev/null

          token=$(curl -fsS -X POST "$base/auth/login" -H "$json" \
            -d "{\"email\":\"$email\",\"password\":\"$password\"}" | jq -r .token)
          test -n "$token" && test "$token" != null

          curl -fsS "$base/auth/me" -H "Authorization: Bearer $token" | jq -e --arg email "$email" '.email == $email'

          id=$(curl -fsS -X POST "$base/snippets" -H "$json" -H "Authorization: Bearer $token" \
            -d '{"title":"CI snippet","content":"hello","expires":1}' | jq -r .id)
          test -n "$id" && test "$id" != null

          curl -fsS "$base/snippets/$id" | jq -e '.title == "CI snippet"'
          curl -fsS "$base/snippets" | jq -e 'length >= 1'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/snippets/0")" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/snippets" -H "$json" -d '{}')" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/snippets" -H "$json" -H 'Authorization: Bearer invalid' -d '{}')" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/unknown")" = "404"
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.local.yml logs
      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.local.yml down -v