apiVersion: apps/v1
kind: Deployment
metadata:
  name: snippetbox-msa-frontend
  labels:
    app.kubernetes.io/name: snippetbox-msa-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: snippetbox
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: snippetbox-msa-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snippetbox-msa-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: snippetbox
    spec:
      serviceAccountName: snippetbox-msa-frontend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: snippetbox-msa-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
              value: "1"
            - name: USER_SERVICE_URL
              value: http://snippetbox-msa-backend-user.$(POD_NAMESPACE).svc.cluster.local:8080
            - name: SNIPPET_SERVICE_URL
              value: http://snippetbox-msa-backend-snippet.$(POD_NAMESPACE).svc.cluster.local:8080
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - sleep
                  - "5"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
          volumeMounts:
            - name: nginx-templates
              mountPath: /etc/nginx/templates
              readOnly: true
      volumes:
        - name: nginx-templates
          configMap:
            name: snippetbox-nginx
