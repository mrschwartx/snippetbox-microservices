apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: snippetbox-backend-user
  labels:
    app.kubernetes.io/name: snippetbox-backend-user
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: snippetbox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: snippetbox-backend-user
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
